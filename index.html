<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
<meta name="robots" content="noindex, nofollow">
<title>리틀타운 팝업스토어 데모 · BetaWIP 11/06</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; height:100%; background:#111; overflow:hidden; touch-action:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#111; }
  #unity-canvas { display:block; background:#231F20; outline:none; }
  #loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#fff; font-family:system-ui, "Malgun Gothic", sans-serif; pointer-events:none; }
  #bar { width:min(60vw, 320px); height:10px; border-radius:6px; background:rgba(255,255,255,.2); overflow:hidden; }
  #fill { width:0; height:100%; background:#ff5fa2; transition:width .2s; }
  #label { font-size:14px; opacity:.85; }
  #warn { position:absolute; left:0; right:0; top:0; z-index:5; font:14px system-ui, sans-serif; }
  #footer { position:fixed; bottom:0; height:38px; display:none; align-items:center; justify-content:space-between; gap:8px; box-sizing:border-box; padding-left:12px; background:#1b1b1b; color:#ddd; font:13px system-ui, "Malgun Gothic", sans-serif; }
  #footer-title { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #fullscreen { flex:none; display:flex; align-items:center; justify-content:center; width:38px; height:38px; margin:0; padding:0; border:0; background:#29a8e0; color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #fullscreen:hover { background:#45b8ec; }
  #fullscreen:disabled { opacity:.4; cursor:default; }
  #fullscreen svg { width:20px; height:20px; }
  #error { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); font-family:system-ui, "Malgun Gothic", sans-serif; }
  #error .box { width:min(92vw, 520px); max-height:86vh; overflow:auto; background:#fff; color:#222; border-radius:12px; padding:18px; box-sizing:border-box; }
  #error h2 { margin:0 0 8px; font-size:18px; }
  #error p { margin:6px 0; font-size:14px; line-height:1.5; }
  #error pre { white-space:pre-wrap; word-break:break-all; background:#f3f3f3; border-radius:8px; padding:10px; font-size:12px; max-height:40vh; overflow:auto; }
  #error .buttons { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  #error button { font-size:15px; padding:8px 14px; border-radius:8px; border:0; background:#ff5fa2; color:#fff; }
  #error button.secondary { background:#ddd; color:#222; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div id="bar"><div id="fill"></div></div><div id="label">불러오는 중… 0%</div></div>
  <div id="warn"></div>
</div>
<div id="footer">
  <span id="footer-title"></span>
  <button id="fullscreen" type="button" title="전체화면" aria-label="전체화면" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg>
  </button>
</div>
<div id="error">
  <div class="box">
    <h2 id="error-title">오류가 발생했어요</h2>
    <p id="error-hint"></p>
    <pre id="error-message"></pre>
    <p>최근 로그</p>
    <pre id="error-logs"></pre>
    <div class="buttons">
      <button class="secondary" id="error-close">닫기</button>
      <button id="error-retry">다시 시작</button>
    </div>
  </div>
</div>
<script>
  // littletown-full-build 스킬의 팝업 데모 WebGL 템플릿. 빌드 동안만 Assets/WebGLTemplates/LittleTownPopupDemo 에 복사된다.
  // 진행 단계(session.stage)와 최근 로그는 검증 스크립트(playtest.mjs)가 읽는다. Unity 인스턴스가 뜨면 running.
  var SESSION_KEY = "lt_popup_webgl_session:" + location.pathname;
  var session = { stage: "page", time: Date.now(), logs: [] };
  var lastSave = 0;

  function saveSession(force) {
    var now = Date.now();
    if (!force && now - lastSave < 1000) return;
    lastSave = now;
    session.time = now;
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
  }

  function pushLog(level, args) {
    var text = Array.prototype.map.call(args, function (a) {
      if (a instanceof Error) return a.message;
      return typeof a === "string" ? a : (function () { try { return JSON.stringify(a); } catch (e) { return String(a); } })();
    }).join(" ");
    session.logs.push(level + " " + text.slice(0, 400));
    if (session.logs.length > 40) session.logs.shift();
    saveSession(level !== "log");
  }

  ["log", "warn", "error"].forEach(function (level) {
    var orig = console[level].bind(console);
    console[level] = function () { pushLog(level, arguments); orig.apply(null, arguments); };
  });

  window.ttReportStage = function (stage) {
    session.stage = stage;
    pushLog("stage", [stage]);
    saveSession(true);
  };

  window.addEventListener("pagehide", function () {
    session.stage = "closed";
    saveSession(true);
  });

  var errorShown = false;
  function describe(message) {
    if (/memory|Cannot enlarge|Invalid array buffer|allocat/i.test(message))
      return "메모리가 부족해 계속할 수 없어요. 다른 탭·앱을 닫은 뒤 다시 시작해 주세요.";
    if (/context lost/i.test(message))
      return "그래픽(WebGL) 컨텍스트를 잃었어요. 메모리가 부족할 때 자주 생깁니다.";
    return "";
  }

  function showError(title, message) {
    pushLog("error", [title + ": " + message]);
    if (errorShown) return;
    errorShown = true;
    var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
    if ((document.fullscreenElement || document.webkitFullscreenElement) && exitFullscreen) {
      var exiting = exitFullscreen.call(document);
      if (exiting && exiting.catch) exiting.catch(function () {});
    }
    document.querySelector("#error-title").textContent = title;
    document.querySelector("#error-hint").textContent = describe(message);
    document.querySelector("#error-message").textContent = message;
    document.querySelector("#error-logs").textContent = session.logs.slice(-15).join("\n");
    document.querySelector("#error").style.display = "flex";
  }

  document.querySelector("#error-close").onclick = function () {
    document.querySelector("#error").style.display = "none";
  };
  document.querySelector("#error-retry").onclick = function () {
    session = { stage: "page", time: Date.now(), logs: [] };
    saveSession(true);
    location.reload();
  };

  // 데모 UI는 기준 1080×1440(3:4) Expand라 세로·가로 화면 모두 맞춘다(CanvasFit). 캔버스는 창을 꽉 채운다.
  var FOOTER_HEIGHT = 38;
  var MAX_RENDER_LONG_SIDE = 2560;
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var BASE_PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
  var stage = document.querySelector("#stage");
  var canvas = document.querySelector("#unity-canvas");
  var footer = document.querySelector("#footer");
  var fullscreenButton = document.querySelector("#fullscreen");

  // 게임이 Screen.fullScreen으로 캔버스 전체화면을 요청하면 #stage로 돌린다. PC에서는 하단 바 버튼으로만 들어간다.
  var nativeRequestFullscreen = Element.prototype.requestFullscreen;
  var nativeWebkitRequestFullscreen = Element.prototype.webkitRequestFullscreen;
  var blockGameFullscreen = !isMobile;

  function catchRejected(request) {
    if (request && request.catch) request.catch(function (e) { console.warn("requestFullscreen rejected: " + (e && e.message)); });
    return request;
  }

  function requestStageFullscreen() {
    if (nativeRequestFullscreen) return catchRejected(nativeRequestFullscreen.call(stage));
    if (nativeWebkitRequestFullscreen) nativeWebkitRequestFullscreen.call(stage);
  }

  if (nativeRequestFullscreen) Element.prototype.requestFullscreen = function () {
    if (this === canvas) {
      if (blockGameFullscreen) return Promise.resolve();
      return requestStageFullscreen() || Promise.resolve();
    }
    return catchRejected(nativeRequestFullscreen.apply(this, arguments));
  };
  if (nativeWebkitRequestFullscreen) Element.prototype.webkitRequestFullscreen = function () {
    if (this === canvas) {
      if (!blockGameFullscreen) requestStageFullscreen();
      return;
    }
    return nativeWebkitRequestFullscreen.apply(this, arguments);
  };

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  var fullscreenSupported = !!(nativeRequestFullscreen || nativeWebkitRequestFullscreen)
    && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  var footerHeight = fullscreenSupported ? FOOTER_HEIGHT : 0;
  footer.style.display = fullscreenSupported ? "flex" : "none";
  document.querySelector("#footer-title").textContent = document.title;

  fullscreenButton.onclick = function () {
    if (!window.unityInstance) return;
    requestStageFullscreen();
  };

  function fit() {
    var fullscreen = isFullscreen();
    var bottom = fullscreen ? 0 : footerHeight;
    var cw = window.innerWidth, ch = window.innerHeight - bottom;
    stage.style.bottom = bottom + "px";
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
    footer.style.width = cw + "px";
    footer.style.left = "0px";
    applyPixelRatio(cw, ch);
  }

  function applyPixelRatio(cw, ch) {
    var ratio = Math.min(BASE_PIXEL_RATIO, MAX_RENDER_LONG_SIDE / Math.max(cw, ch, 1));
    if (window.unityInstance && window.unityInstance.Module) window.unityInstance.Module.devicePixelRatio = ratio;
    return ratio;
  }

  var refitTimer = 0;
  function scheduleFit() {
    fit();
    requestAnimationFrame(fit);
    clearTimeout(refitTimer);
    refitTimer = setTimeout(fit, 300);
  }

  function onFullscreenChange() {
    scheduleFit();
  }

  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", scheduleFit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleFit);
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);
  fit();

  canvas.addEventListener("webglcontextlost", function () {
    showError("그래픽 오류", "WebGL context lost");
  });

  function unityShowBanner(msg, type) {
    if (type == "error") { showError("오류가 발생했어요", msg); return; }
    pushLog("warn", [msg]);
    var box = document.querySelector("#warn");
    var div = document.createElement("div");
    div.textContent = msg;
    div.style.padding = "10px";
    div.style.background = "#fc3";
    box.appendChild(div);
    setTimeout(function () { box.removeChild(div); }, 5000);
  }

  var buildUrl = "Build";
  // 같은 주소에 덮어 배포하므로 브라우저 캐시의 이전 빌드와 섞이지 않게 빌드 sha를 붙인다.
  var buildQuery = "?v=82eb243f";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/PopupDemo-WebGLBuild.data.unityweb" + buildQuery,
    frameworkUrl: buildUrl + "/PopupDemo-WebGLBuild.framework.js.unityweb" + buildQuery,
    codeUrl: buildUrl + "/PopupDemo-WebGLBuild.wasm.unityweb" + buildQuery,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "TeeniepingLittleTown PopupDemo",
    productVersion: "0.0.1",
    showBanner: unityShowBanner,
    errorHandler: function (message) {
      showError("오류가 발생했어요", String(message));
      return true;
    },
    devicePixelRatio: applyPixelRatio(canvas.clientWidth, canvas.clientHeight),
    autoSyncPersistentDataPath: true,
  };

  function start() {
    session = { stage: "loader", time: Date.now(), logs: session.logs };
    saveSession(true);
    var script = document.createElement("script");
    script.src = buildUrl + "/PopupDemo-WebGLBuild.loader.js" + buildQuery;
    script.onerror = function () { showError("로딩 실패", "로더 스크립트를 받지 못했어요: " + script.src); };
    script.onload = function () {
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var label = document.querySelector("#label");
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = (100 * p) + "%";
        label.textContent = "불러오는 중… " + Math.round(100 * p) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        fit();
        fullscreenButton.disabled = false;
        loading.style.display = "none";
        window.ttReportStage("running");
        canvas.focus();
      }).catch(function (message) {
        label.textContent = "로딩 실패";
        showError("로딩 실패", String(message));
      });
    };
    document.body.appendChild(script);
  }

  start();
</script>
</body>
</html>
